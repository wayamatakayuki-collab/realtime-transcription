<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef4ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>リアルタイム文字起こし</title>
  <style>
    :root{
      --bg:#edf3fb;
      --panel:#ffffff;
      --panel-2:#f7f9fd;
      --text:#142033;
      --muted:#64748b;
      --line:#dce4ef;
      --blue:#246bfd;
      --blue-dark:#1754cf;
      --red:#df3b3b;
      --red-soft:#fff0f0;
      --green:#17a765;
      --shadow:0 16px 42px rgba(44,65,102,.12);
      --radius:22px;
    }

    *{box-sizing:border-box}
    html{height:100%}
    body{
      margin:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 0 0, rgba(56,132,255,.14), transparent 26rem),
        linear-gradient(180deg,#f7faff 0,#edf3fb 100%);
    }

    button,select,textarea,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}

    .app{
      width:min(1180px,calc(100% - 28px));
      margin:0 auto;
      padding:22px 0 calc(32px + env(safe-area-inset-bottom));
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .brand-icon{
      width:46px;height:46px;
      display:grid;place-items:center;
      border-radius:15px;
      background:linear-gradient(145deg,#3e82ff,#1f61e9);
      color:#fff;
      font-size:22px;
      box-shadow:0 10px 24px rgba(36,107,253,.25);
      flex:none;
    }

    h1{
      margin:0;
      font-size:clamp(22px,3vw,32px);
      line-height:1.2;
      letter-spacing:.01em;
    }

    .credit{
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
    }

    .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

    .icon-btn,.btn{
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      min-height:46px;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 5px 14px rgba(40,62,96,.06);
      transition:.15s ease;
    }

    .icon-btn{
      width:46px;
      padding:0;
      display:grid;
      place-items:center;
      font-size:19px;
    }

    .icon-btn.active{
      background:#e8f0ff;
      border-color:#b8ceff;
      color:var(--blue);
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 285px;
      gap:14px;
      align-items:start;
    }

    .workspace,.side{
      background:rgba(255,255,255,.92);
      border:1px solid rgba(255,255,255,.9);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .controls{
      display:flex;
      gap:9px;
      flex-wrap:wrap;
      align-items:center;
      padding:14px;
      border-bottom:1px solid var(--line);
      background:rgba(249,251,255,.94);
    }

    .btn{
      padding:0 15px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
    }

    .btn.start{
      color:#fff;
      border-color:var(--blue);
      background:linear-gradient(180deg,#3e82ff,var(--blue));
      min-width:165px;
    }

    .btn.start:hover:not(:disabled){background:var(--blue-dark)}
    .btn.stop{color:var(--red);background:var(--red-soft);border-color:#ffc8c8}
    .btn:disabled{opacity:.46;cursor:not-allowed}
    .control-spacer{flex:1}

    .option-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }

    .option{
      display:flex;
      align-items:center;
      gap:8px;
      min-height:42px;
      padding:0 11px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--panel-2);
      color:var(--muted);
      font-size:13px;
      font-weight:800;
    }

    select{
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-weight:800;
    }

    .toggle{
      display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none
    }
    .toggle input{display:none}
    .toggle-ui{
      width:38px;height:22px;border-radius:99px;background:#cbd5e1;position:relative;transition:.18s
    }
    .toggle-ui:after{
      content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
      border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.18s
    }
    .toggle input:checked + .toggle-ui{background:#4c83fa}
    .toggle input:checked + .toggle-ui:after{left:19px}

    .status-strip{
      display:grid;
      grid-template-columns:1.4fr repeat(3,.65fr);
      gap:8px;
      padding:12px 14px;
      background:#f7f9fd;
      border-bottom:1px solid var(--line);
    }

    .status-card{
      min-height:66px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      display:flex;flex-direction:column;justify-content:center;
    }

    .label{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}
    .value{font-size:20px;font-weight:900;line-height:1.1}
    .status-value{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:900}
    .status-dot{
      width:11px;height:11px;border-radius:50%;background:#9aa7ba;flex:none
    }
    .status-dot.listening{background:var(--green);box-shadow:0 0 0 7px rgba(23,167,101,.12);animation:pulse 1.5s infinite}
    .status-dot.error{background:var(--red)}
    @keyframes pulse{50%{opacity:.45}}

    .editor-area{padding:14px}
    .editor-shell{
      position:relative;
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      overflow:hidden;
    }

    #transcript{
      display:block;
      width:100%;
      min-height:58vh;
      resize:vertical;
      border:0;
      outline:0;
      padding:20px 20px 82px;
      color:var(--text);
      background:#fff;
      font-size:22px;
      line-height:1.9;
      letter-spacing:.018em;
    }

    #transcript::placeholder{color:#a3afc0}

    .interim{
      position:absolute;
      left:14px;right:14px;bottom:12px;
      min-height:48px;
      max-height:82px;
      overflow:auto;
      padding:10px 12px;
      border:1px dashed #c8d2e0;
      border-radius:13px;
      background:rgba(247,249,253,.95);
      color:#718096;
      font-size:13px;
      line-height:1.55;
      pointer-events:none;
    }

    .interim:empty::before{content:"認識途中の言葉";color:#a4adbb}

    .side{padding:14px;display:grid;gap:10px}
    .side-title{font-size:13px;color:var(--muted);font-weight:900;padding:2px 2px 4px}
    .side .btn{width:100%;justify-content:flex-start;background:#fff}
    .side .btn.primary-lite{color:var(--blue);background:#edf3ff;border-color:#cbdafe}
    .divider{height:1px;background:var(--line);margin:2px 0}

    .unsupported{
      display:none;
      margin-top:12px;padding:13px 15px;border-radius:14px;
      background:#fff7df;border:1px solid #f2d588;color:#865d00;font-size:13px;line-height:1.6
    }

    .toast{
      position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
      transform:translate(-50%,20px);
      padding:11px 17px;border-radius:999px;background:#142033;color:#fff;
      font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:100
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    .mobile-dock{display:none}

    body.focus-mode .topbar,
    body.focus-mode .side,
    body.focus-mode .option-row,
    body.focus-mode .status-strip{display:none}
    body.focus-mode .layout{display:block}
    body.focus-mode .app{width:min(980px,calc(100% - 20px));padding-top:10px}
    body.focus-mode #transcript{min-height:calc(100vh - 145px)}

    @media(max-width:900px){
      .layout{grid-template-columns:1fr}
      .side{grid-template-columns:repeat(3,1fr)}
      .side-title,.divider{display:none}
      .status-strip{grid-template-columns:1.25fr repeat(3,.65fr)}
    }

    @media(max-width:650px){
      body{background:#eef3fb}
      .app{width:100%;padding:0 0 calc(92px + env(safe-area-inset-bottom))}
      .topbar{
        position:sticky;top:0;z-index:20;
        margin:0;padding:12px 13px;
        background:rgba(247,250,255,.94);
        backdrop-filter:blur(14px);
        border-bottom:1px solid var(--line)
      }
      .brand-icon{width:40px;height:40px;border-radius:13px;font-size:19px}
      h1{font-size:20px}
      .credit{font-size:10px}
      .top-actions .icon-btn:nth-child(2){display:none}
      .layout{display:block}
      .workspace{border-radius:0;border-left:0;border-right:0;box-shadow:none}
      .controls{display:none}
      .option-row{
        flex-wrap:nowrap;overflow-x:auto;padding:10px 12px;
        scrollbar-width:none
      }
      .option-row::-webkit-scrollbar{display:none}
      .option{flex:none}
      .status-strip{
        grid-template-columns:1.4fr repeat(3,.72fr);
        overflow-x:auto;padding:10px 12px
      }
      .status-card{min-width:86px;min-height:60px}
      .status-card:first-child{min-width:150px}
      .value{font-size:18px}
      .editor-area{padding:10px}
      .editor-shell{border-radius:16px}
      #transcript{
        min-height:calc(100vh - 286px);
        padding:16px 15px 76px;
        font-size:20px;
        line-height:1.8;
        resize:none
      }
      .interim{left:9px;right:9px;bottom:9px}
      .side{display:grid;grid-template-columns:repeat(2,1fr);border-radius:0;box-shadow:none;border:0;padding:10px;background:transparent}
      .side .btn{justify-content:center;min-height:48px}
      .mobile-dock{
        position:fixed;display:grid;grid-template-columns:1fr 1fr 58px;
        gap:9px;left:0;right:0;bottom:0;z-index:50;
        padding:10px 12px calc(10px + env(safe-area-inset-bottom));
        background:rgba(255,255,255,.96);
        backdrop-filter:blur(16px);
        border-top:1px solid var(--line);
        box-shadow:0 -10px 30px rgba(44,65,102,.12)
      }
      .mobile-dock .btn{min-height:54px}
      .mobile-dock .more{padding:0}
      body.focus-mode .topbar{display:flex}
      body.focus-mode .option-row,
      body.focus-mode .status-strip{display:none}
      body.focus-mode #transcript{min-height:calc(100vh - 164px)}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🎙</div>
        <div>
          <h1>リアルタイム文字起こし</h1>
          <div class="credit">@2026 Takayuki WAYAMA</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="wakeButton" class="icon-btn" type="button" title="画面を消さない">☀</button>
        <button id="focusButton" class="icon-btn" type="button" title="集中表示">⛶</button>
      </div>
    </header>

    <section class="layout">
      <div class="workspace">
        <div class="controls">
          <button id="startButton" class="btn start" type="button">● 文字起こし開始</button>
          <button id="stopButton" class="btn stop" type="button" disabled>■ 停止</button>
          <button id="copyButton" class="btn" type="button">全文コピー</button>
          <button id="lineBreakButton" class="btn" type="button">改行</button>
          <div class="control-spacer"></div>
          <button id="clearButton" class="btn" type="button">全文クリア</button>
        </div>

        <div class="option-row">
          <div class="option">
            <label for="fontSizeSelect">文字</label>
            <select id="fontSizeSelect">
              <option value="18">小</option>
              <option value="22" selected>標準</option>
              <option value="28">大</option>
              <option value="34">特大</option>
            </select>
          </div>
          <div class="option">
            <label class="toggle">句読点
              <input id="punctuationToggle" type="checkbox" checked>
              <span class="toggle-ui"></span>
            </label>
          </div>
          <div class="option">
            <label class="toggle">自動改行
              <input id="autoBreakToggle" type="checkbox" checked>
              <span class="toggle-ui"></span>
            </label>
          </div>
          <div class="option">
            <label class="toggle">自動スクロール
              <input id="autoScrollToggle" type="checkbox" checked>
              <span class="toggle-ui"></span>
            </label>
          </div>
        </div>

        <div class="status-strip">
          <div class="status-card">
            <div class="label">状態</div>
            <div class="status-value"><span id="statusDot" class="status-dot"></span><span id="statusText">待機中</span></div>
          </div>
          <div class="status-card"><div class="label">文字数</div><div id="characterCount" class="value">0</div></div>
          <div class="status-card"><div class="label">行数</div><div id="lineCount" class="value">0</div></div>
          <div class="status-card"><div class="label">時間</div><div id="elapsedTime" class="value">00:00</div></div>
        </div>

        <div class="editor-area">
          <div class="editor-shell">
            <textarea id="transcript" aria-label="文字起こし結果" placeholder="文字起こしを開始すると、ここに文章が表示されます。"></textarea>
            <div id="interimText" class="interim" aria-live="polite"></div>
          </div>
          <div id="unsupportedNotice" class="unsupported"></div>
        </div>
      </div>

      <aside class="side">
        <div class="side-title">操作</div>
        <button id="timestampButton" class="btn" type="button">🕒 時刻挿入</button>
        <button id="downloadButton" class="btn" type="button">↓ テキスト保存</button>
        <button id="shareButton" class="btn primary-lite" type="button">↗ 共有</button>
        <div class="divider"></div>
        <button id="sideCopyButton" class="btn" type="button">⧉ 全文コピー</button>
        <button id="sideClearButton" class="btn" type="button">⌫ 全文クリア</button>
      </aside>
    </section>
  </main>

  <div class="mobile-dock">
    <button id="mobileStartButton" class="btn start" type="button">● 開始</button>
    <button id="mobileStopButton" class="btn stop" type="button" disabled>■ 停止</button>
    <button id="mobileCopyButton" class="btn more" type="button" aria-label="全文コピー">⧉</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    "use strict";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const $ = id => document.getElementById(id);

    const transcript = $("transcript");
    const interimText = $("interimText");
    const startButtons = [$("startButton"), $("mobileStartButton")];
    const stopButtons = [$("stopButton"), $("mobileStopButton")];
    const copyButtons = [$("copyButton"), $("sideCopyButton"), $("mobileCopyButton")];
    const clearButtons = [$("clearButton"), $("sideClearButton")];

    const lineBreakButton = $("lineBreakButton");
    const timestampButton = $("timestampButton");
    const downloadButton = $("downloadButton");
    const shareButton = $("shareButton");
    const wakeButton = $("wakeButton");
    const focusButton = $("focusButton");
    const fontSizeSelect = $("fontSizeSelect");
    const punctuationToggle = $("punctuationToggle");
    const autoBreakToggle = $("autoBreakToggle");
    const autoScrollToggle = $("autoScrollToggle");
    const statusText = $("statusText");
    const statusDot = $("statusDot");
    const characterCount = $("characterCount");
    const lineCount = $("lineCount");
    const elapsedTime = $("elapsedTime");
    const unsupportedNotice = $("unsupportedNotice");
    const toast = $("toast");

    let recognition = null;
    let shouldContinue = false;
    let restartTimer = null;
    let autoBreakTimer = null;
    let lastFinalText = "";
    let lastFinalAt = 0;
    let lastFinalEventAt = 0;
    let startTime = null;
    let clockTimer = null;
    let wakeLock = null;

    function toastMessage(message){
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1700);
    }

    function updateStats(){
      const value = transcript.value;
      characterCount.textContent = value.length.toLocaleString("ja-JP");
      lineCount.textContent = value ? value.split(/\n/).length.toLocaleString("ja-JP") : "0";
    }

    function setStatus(message, mode="idle"){
      statusText.textContent = message;
      statusDot.className = "status-dot";
      if(mode === "listening") statusDot.classList.add("listening");
      if(mode === "error") statusDot.classList.add("error");
    }

    function setRunning(running){
      startButtons.forEach(b => b.disabled = running);
      stopButtons.forEach(b => b.disabled = !running);
    }

    function startClock(){
      startTime = Date.now();
      clearInterval(clockTimer);
      clockTimer = setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        elapsedTime.textContent =
          String(Math.floor(sec / 60)).padStart(2,"0") + ":" +
          String(sec % 60).padStart(2,"0");
      },500);
    }

    function stopClock(){
      clearInterval(clockTimer);
      clockTimer = null;
    }

    function normalizeText(text){
      return text.replace(/[ \t]+/g," ").trim();
    }

    function endsWithPunctuation(text){
      return /[。！？!?、…]$/.test(text.trim());
    }

    function spokenCommands(text){
      return text
        .replace(/(?:てん|点)/g,"、")
        .replace(/(?:まる|丸)/g,"。")
        .replace(/(?:かいぎょう|改行|だんらく|段落)/g,"\n")
        .replace(/(?:はてな|クエスチョン)/g,"？")
        .replace(/(?:びっくり|感嘆符)/g,"！");
    }

    function chooseSeparator(now){
      const current = transcript.value.trimEnd();
      if(!current) return "";
      if(!punctuationToggle.checked) return /\s$/.test(transcript.value) ? "" : " ";
      if(endsWithPunctuation(current)) return "";
      const gap = lastFinalEventAt ? now - lastFinalEventAt : 0;
      if(gap >= 750) return "。";
      if(gap >= 350) return "、";
      return "";
    }

    function scheduleAutoBreak(){
      clearTimeout(autoBreakTimer);
      if(!shouldContinue || !autoBreakToggle.checked) return;
      autoBreakTimer = setTimeout(() => {
        const current = transcript.value.trimEnd();
        if(!current || current.endsWith("\n")) return;
        transcript.value = current + (endsWithPunctuation(current) ? "\n" : "。\n");
        updateStats();
        moveToEnd();
      },1800);
    }

    function moveToEnd(){
      if(!autoScrollToggle.checked) return;
      transcript.scrollTop = transcript.scrollHeight;
      transcript.selectionStart = transcript.selectionEnd = transcript.value.length;
    }

    function appendFinalText(text){
      let cleaned = spokenCommands(normalizeText(text));
      if(!cleaned) return;
      const now = Date.now();
      if(cleaned === lastFinalText && now - lastFinalAt < 1800) return;
      lastFinalText = cleaned;
      lastFinalAt = now;
      transcript.value += chooseSeparator(now) + cleaned;
      lastFinalEventAt = now;
      updateStats();
      moveToEnd();
      scheduleAutoBreak();
    }

    function createRecognition(){
      recognition = new SpeechRecognition();
      recognition.lang = "ja-JP";
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        setRunning(true);
        setStatus("認識中","listening");
      };

      recognition.onresult = event => {
        clearTimeout(autoBreakTimer);
        let interim = "";
        for(let i=event.resultIndex;i<event.results.length;i++){
          const result = event.results[i];
          const text = result[0]?.transcript || "";
          result.isFinal ? appendFinalText(text) : interim += text;
        }
        interimText.textContent = normalizeText(interim);
      };

      recognition.onerror = event => {
        if(event.error === "no-speech"){
          setStatus("音声待機中","listening");
          return;
        }
        if(event.error === "aborted") return;
        shouldContinue = false;
        setRunning(false);
        stopClock();
        interimText.textContent = "";
        const messages = {
          "not-allowed":"マイクを許可してください",
          "service-not-allowed":"音声認識を利用できません",
          "audio-capture":"マイクを確認してください",
          "network":"通信を確認してください"
        };
        setStatus(messages[event.error] || "エラーが発生しました","error");
      };

      recognition.onend = () => {
        interimText.textContent = "";
        if(shouldContinue){
          setStatus("再接続中","listening");
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            try{ recognition.start(); }
            catch(e){ recognition.onend(); }
          },350);
        }else{
          setRunning(false);
          setStatus("停止中");
        }
      };
    }

    function startRecognition(){
      if(!recognition) return;
      shouldContinue = true;
      lastFinalEventAt = 0;
      setStatus("起動中","listening");
      startClock();
      try{ recognition.start(); }
      catch(e){
        if(e.name !== "InvalidStateError"){
          shouldContinue = false;
          setRunning(false);
          stopClock();
          setStatus("開始できません","error");
        }
      }
    }

    function stopRecognition(){
      shouldContinue = false;
      clearTimeout(restartTimer);
      clearTimeout(autoBreakTimer);
      interimText.textContent = "";
      stopClock();
      try{ recognition?.stop(); }catch(e){}
      setRunning(false);
      setStatus("停止中");
    }

    async function copyText(){
      if(!transcript.value){ toastMessage("コピーする文章がありません"); return; }
      try{
        await navigator.clipboard.writeText(transcript.value);
        toastMessage("全文をコピーしました");
      }catch(e){
        transcript.select();
        document.execCommand("copy");
        transcript.setSelectionRange(transcript.value.length,transcript.value.length);
        toastMessage("全文をコピーしました");
      }
    }

    function insertAtCursor(text){
      const start = transcript.selectionStart;
      const end = transcript.selectionEnd;
      transcript.setRangeText(text,start,end,"end");
      updateStats();
      transcript.focus();
      moveToEnd();
    }

    function insertTimestamp(){
      const now = new Date();
      insertAtCursor(`[${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}] `);
    }

    function saveText(){
      if(!transcript.value){ toastMessage("保存する文章がありません"); return; }
      const now = new Date();
      const p = v => String(v).padStart(2,"0");
      const filename = `transcript_${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}.txt`;
      const url = URL.createObjectURL(new Blob([transcript.value],{type:"text/plain;charset=utf-8"}));
      const a = document.createElement("a");
      a.href = url;a.download = filename;a.click();
      URL.revokeObjectURL(url);
      toastMessage("テキストを保存しました");
    }

    async function shareText(){
      if(!transcript.value){ toastMessage("共有する文章がありません"); return; }
      if(navigator.share){
        try{
          await navigator.share({title:"文字起こし",text:transcript.value});
        }catch(e){}
      }else{
        await copyText();
        toastMessage("共有非対応のためコピーしました");
      }
    }

    function clearText(){
      if(!transcript.value){ toastMessage("文章がありません"); return; }
      if(!confirm("表示中の文章をすべて消しますか？")) return;
      transcript.value = "";
      interimText.textContent = "";
      lastFinalText = "";
      lastFinalAt = 0;
      lastFinalEventAt = 0;
      updateStats();
      transcript.focus();
    }

    async function toggleWakeLock(){
      if(!("wakeLock" in navigator)){
        toastMessage("この端末では利用できません");
        return;
      }
      try{
        if(wakeLock){
          await wakeLock.release();
          wakeLock = null;
          wakeButton.classList.remove("active");
          toastMessage("通常の画面設定に戻しました");
        }else{
          wakeLock = await navigator.wakeLock.request("screen");
          wakeButton.classList.add("active");
          toastMessage("画面を消さない設定にしました");
          wakeLock.addEventListener("release",() => {
            wakeLock = null;
            wakeButton.classList.remove("active");
          });
        }
      }catch(e){ toastMessage("画面固定を開始できません"); }
    }

    function toggleFocus(){
      document.body.classList.toggle("focus-mode");
      focusButton.classList.toggle("active");
    }

    startButtons.forEach(b => b.addEventListener("click",startRecognition));
    stopButtons.forEach(b => b.addEventListener("click",stopRecognition));
    copyButtons.forEach(b => b.addEventListener("click",copyText));
    clearButtons.forEach(b => b.addEventListener("click",clearText));
    lineBreakButton.addEventListener("click",() => insertAtCursor("\n"));
    timestampButton.addEventListener("click",insertTimestamp);
    downloadButton.addEventListener("click",saveText);
    shareButton.addEventListener("click",shareText);
    wakeButton.addEventListener("click",toggleWakeLock);
    focusButton.addEventListener("click",toggleFocus);
    fontSizeSelect.addEventListener("change",() => transcript.style.fontSize = fontSizeSelect.value + "px");
    transcript.addEventListener("input",updateStats);

    document.addEventListener("visibilitychange",async() => {
      if(wakeLock && document.visibilityState === "visible"){
        try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
      }
    });

    window.addEventListener("beforeunload",() => {
      shouldContinue = false;
      clearInterval(clockTimer);
      clearTimeout(autoBreakTimer);
      try{ recognition?.abort(); }catch(e){}
    });

    if(!SpeechRecognition){
      startButtons.forEach(b => b.disabled = true);
      unsupportedNotice.style.display = "block";
      unsupportedNotice.textContent = "このブラウザでは音声認識を利用できません。対応ブラウザで開いてください。";
      setStatus("ブラウザ非対応","error");
    }else{
      createRecognition();
    }

    updateStats();
  })();
  </script>
</body>
</html>
