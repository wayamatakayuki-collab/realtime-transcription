<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>リアルタイム文字起こし</title>
  <style>
    :root{
      --bg:#f3f6fb;
      --panel:#ffffff;
      --panel-2:#f8fafc;
      --panel-3:#eef3f8;
      --text:#182230;
      --muted:#667085;
      --line:#dbe3ec;
      --line-strong:#c3cfdd;
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --primary-soft:#eaf1ff;
      --danger:#d92d20;
      --danger-soft:#fff1f0;
      --success:#039855;
      --shadow:0 18px 50px rgba(30,55,90,.10);
      --radius:22px;
    }


    :root[data-theme="dark"]{
      --bg:#0a1020;
      --panel:#111827;
      --panel-2:#172033;
      --panel-3:#0d1526;
      --text:#f8fafc;
      --muted:#94a3b8;
      --line:#243047;
      --line-strong:#334155;
      --primary:#3b82f6;
      --primary-dark:#2563eb;
      --primary-soft:rgba(59,130,246,.14);
      --danger:#f87171;
      --danger-soft:rgba(248,113,113,.10);
      --success:#22c55e;
      --shadow:0 26px 80px rgba(0,0,0,.36);
    }

    :root[data-theme="dark"] body{
      background:
        radial-gradient(circle at 8% 8%, rgba(37,99,235,.17), transparent 28rem),
        radial-gradient(circle at 88% 12%, rgba(14,165,233,.08), transparent 24rem),
        linear-gradient(180deg,#0a1020 0%,#080d18 100%);
    }

    :root[data-theme="dark"] .title-wrap h1{color:#f8fafc}
    :root[data-theme="dark"] .panel{background:rgba(17,24,39,.96);border-color:rgba(71,85,105,.45)}
    :root[data-theme="dark"] .main-toolbar{background:linear-gradient(180deg,#172033,#111827)}
    :root[data-theme="dark"] .settings{background:#0d1526}
    :root[data-theme="dark"] .setting,
    :root[data-theme="dark"] .tool-btn{background:#172033;color:#f8fafc}
    :root[data-theme="dark"] .statusbar{background:#101827}
    :root[data-theme="dark"] .metric strong{color:#e2e8f0}
    :root[data-theme="dark"] .editor-wrap,
    :root[data-theme="dark"] .editor-box,
    :root[data-theme="dark"] #transcript{background:#0c1423;color:#f8fafc}
    :root[data-theme="dark"] .interim{background:rgba(30,41,59,.96);border-color:#3b4a60;color:#94a3b8}
    :root[data-theme="dark"] .toast{background:#e2e8f0;color:#111827}

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.08), transparent 28rem),
        linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%);
      color:var(--text);
    }

    button,select,textarea{font:inherit}

    .app{
      width:min(1380px,calc(100% - 44px));
      margin:0 auto;
      padding:28px 0 36px;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:16px;
    }

    .title-wrap{
      display:flex;
      align-items:center;
      gap:13px;
      min-width:0;
    }

    .title-wrap::before{
      content:"";
      width:8px;
      height:38px;
      border-radius:999px;
      background:linear-gradient(180deg,#4f8df7,#2563eb);
      box-shadow:0 0 18px rgba(37,99,235,.22);
      flex:none;
    }

    .title-wrap h1{
      margin:0;
      font-size:31px;
      line-height:1.15;
      letter-spacing:-.025em;
      font-weight:800;
      color:#162033;
      white-space:nowrap;
    }

    .header-actions{
      display:flex;
      gap:8px;
      flex:none;
    }

    .tool-btn,
    .primary-btn,
    .danger-btn{
      min-height:44px;
      border-radius:12px;
      border:1px solid var(--line);
      padding:0 15px;
      background:#fff;
      color:var(--text);
      font-weight:700;
      cursor:pointer;
      transition:.15s ease;
      box-shadow:0 4px 12px rgba(30,55,90,.05);
    }

    .tool-btn:hover:not(:disabled){
      border-color:var(--line-strong);
      background:#f8fafc;
      transform:translateY(-1px);
    }

    .primary-btn{
      background:linear-gradient(180deg,#3f7ff0,var(--primary));
      border-color:#3f7ff0;
      color:#fff;
      box-shadow:0 8px 20px rgba(37,99,235,.20);
    }

    .primary-btn:hover:not(:disabled){
      background:linear-gradient(180deg,#4b8af8,var(--primary-dark));
      transform:translateY(-1px);
    }

    .danger-btn{
      background:var(--danger-soft);
      border-color:#f8c7c3;
      color:var(--danger);
    }

    button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

    .panel{
      background:rgba(255,255,255,.96);
      border:1px solid rgba(219,227,236,.95);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .main-toolbar{
      display:flex;
      align-items:center;
      gap:9px;
      flex-wrap:wrap;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#fbfcfe);
    }

    .main-toolbar .spacer{flex:1 1 auto}

    .settings{
      display:flex;
      align-items:center;
      gap:10px;
      padding:11px 16px;
      background:var(--panel-2);
      border-bottom:1px solid var(--line);
      overflow-x:auto;
      scrollbar-width:none;
    }

    .settings::-webkit-scrollbar{display:none}

    .setting{
      display:flex;
      align-items:center;
      gap:8px;
      min-height:38px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      flex:none;
      white-space:nowrap;
    }

    .setting select{
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-weight:700;
    }

    .switch{
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
    }

    .switch input{display:none}

    .switch-ui{
      width:36px;
      height:21px;
      border-radius:999px;
      background:#cbd5e1;
      position:relative;
      transition:.18s ease;
    }

    .switch-ui::after{
      content:"";
      position:absolute;
      top:3px;
      left:3px;
      width:15px;
      height:15px;
      border-radius:50%;
      background:#fff;
      transition:.18s ease;
      box-shadow:0 1px 4px rgba(16,24,40,.18);
    }

    .switch input:checked + .switch-ui{
      background:var(--primary);
    }

    .switch input:checked + .switch-ui::after{
      left:18px;
    }

    .statusbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:13px;
      font-weight:700;
      white-space:nowrap;
    }

    .status-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#98a2b3;
    }

    .status-dot.listening{
      background:var(--success);
      box-shadow:0 0 0 6px rgba(3,152,85,.12);
      animation:pulse 1.5s infinite;
    }

    .status-dot.error{background:var(--danger)}
    @keyframes pulse{50%{opacity:.45}}

    .metrics{
      display:flex;
      gap:22px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .metric{white-space:nowrap}

    .metric strong{
      color:var(--text);
      font-size:14px;
      margin-left:6px;
    }

    .editor-wrap{
      padding:16px;
      background:#fff;
    }

    .editor-box{
      position:relative;
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      background:#fff;
      box-shadow:inset 0 1px 0 rgba(16,24,40,.02);
    }

    #transcript{
      width:100%;
      min-height:64vh;
      border:0;
      outline:0;
      resize:vertical;
      padding:24px 24px 86px;
      font-size:22px;
      line-height:1.9;
      letter-spacing:.01em;
      color:var(--text);
      background:#fff;
      caret-color:var(--primary);
    }

    #transcript::placeholder{color:#98a2b3}

    .interim{
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      min-height:44px;
      max-height:70px;
      overflow:auto;
      padding:10px 12px;
      border-radius:10px;
      background:#f8fafc;
      border:1px dashed var(--line-strong);
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
      pointer-events:none;
    }

    .interim:empty::before{
      content:"認識途中のテキスト";
      color:#98a2b3;
    }

    .credit{
      text-align:center;
      color:#98a2b3;
      font-size:11px;
      padding:16px 0 0;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:26px;
      transform:translate(-50%,16px);
      background:#182230;
      color:#fff;
      border-radius:999px;
      padding:10px 16px;
      font-size:13px;
      font-weight:700;
      opacity:0;
      pointer-events:none;
      transition:.18s ease;
      z-index:100;
      box-shadow:0 12px 28px rgba(16,24,40,.22);
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media (max-width: 1024px){
      .app{
        width:min(100% - 24px,1024px);
        padding-top:20px;
      }

      .title-wrap h1{font-size:27px}

      .main-toolbar .primary-btn,
      .main-toolbar .danger-btn,
      .main-toolbar .tool-btn{
        flex:1 1 calc(25% - 9px);
        white-space:nowrap;
      }

      .main-toolbar .spacer{display:none}
      .statusbar{flex-wrap:wrap}
      #transcript{min-height:60vh}
    }

    @media (max-width: 680px){
      .app{
        width:100%;
        padding:0 0 calc(134px + env(safe-area-inset-bottom));
      }

      .header{
        position:sticky;
        top:0;
        z-index:20;
        margin:0;
        padding:12px 13px;
        background:rgba(255,255,255,.96);
        backdrop-filter:blur(14px);
        border-bottom:1px solid var(--line);
      }

      .title-wrap{
        gap:9px;
        min-width:0;
        flex:1 1 auto;
      }

      .title-wrap::before{
        width:6px;
        height:27px;
      }

      .title-wrap h1{
        font-size:18px;
        overflow:hidden;
        text-overflow:ellipsis;
      }

      .header-actions .tool-btn{
        min-height:38px;
        padding:0 10px;
        font-size:11px;
        white-space:nowrap;
      }

      .panel{
        border:0;
        border-radius:0;
        box-shadow:none;
      }

      .settings{
        padding:9px 10px;
        gap:7px;
      }

      .statusbar{
        padding:10px 12px;
        gap:10px;
      }

      .metrics{
        width:100%;
        justify-content:space-between;
        gap:6px;
      }

      .editor-wrap{padding:9px}
      .editor-box{border-radius:12px}

      #transcript{
        min-height:calc(100vh - 280px);
        resize:none;
        padding:16px 14px 76px;
        font-size:20px;
        line-height:1.82;
      }

      .interim{
        left:8px;
        right:8px;
        bottom:8px;
      }

      .credit{display:none}

      .main-toolbar{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        z-index:50;
        display:grid;
        grid-template-columns:repeat(4,minmax(0,1fr));
        grid-auto-rows:50px;
        gap:8px;
        padding:9px 10px calc(9px + env(safe-area-inset-bottom));
        background:rgba(255,255,255,.98);
        backdrop-filter:blur(14px);
        border-top:1px solid var(--line);
        border-bottom:0;
        box-shadow:0 -10px 30px rgba(30,55,90,.10);
      }

      .main-toolbar .primary-btn,
      .main-toolbar .danger-btn,
      .main-toolbar .tool-btn{
        width:100%;
        min-width:0;
        min-height:50px;
        padding:0 4px;
        font-size:11px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }

      #downloadButton{grid-column:1/3}
      #clearButton{grid-column:3/5}
      .main-toolbar .spacer{display:none}
    }
  </style>

  <style id="theme-mobile-overrides">
    .mobile-dock{display:none}

    @media (max-width:680px){
      .app{
        padding-bottom:calc(82px + env(safe-area-inset-bottom));
      }

      .header-actions{
        display:flex;
        gap:6px;
      }

      .header-actions .tool-btn{
        max-width:112px;
      }

      .main-toolbar{
        position:static;
        display:flex;
        flex-wrap:nowrap;
        gap:7px;
        overflow-x:auto;
        padding:9px 10px;
        background:#fff;
        border-top:0;
        border-bottom:1px solid var(--line);
        box-shadow:none;
        scrollbar-width:none;
      }

      :root[data-theme="dark"] .main-toolbar{
        background:#111827;
      }

      .main-toolbar::-webkit-scrollbar{
        display:none;
      }

      .main-toolbar .primary-btn,
      .main-toolbar .danger-btn,
      .main-toolbar #copyButton{
        display:none;
      }

      .main-toolbar .tool-btn{
        display:block;
        flex:0 0 auto;
        width:auto;
        min-width:88px;
        height:42px;
        min-height:42px;
        padding:0 12px;
        font-size:11px;
        overflow:visible;
        text-overflow:clip;
      }

      .main-toolbar .spacer{
        display:none;
      }

      #timestampButton,
      #downloadButton,
      #clearButton{
        display:block;
        grid-column:auto;
      }

      .mobile-dock{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        z-index:60;
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
        gap:8px;
        padding:9px 10px calc(9px + env(safe-area-inset-bottom));
        background:rgba(255,255,255,.97);
        border-top:1px solid var(--line);
        box-shadow:0 -10px 30px rgba(30,55,90,.10);
        backdrop-filter:blur(14px);
      }

      :root[data-theme="dark"] .mobile-dock{
        background:rgba(10,16,32,.97);
      }

      .mobile-dock button{
        min-width:0;
        min-height:50px;
        padding:0 8px;
        border-radius:12px;
        font-size:12px;
        white-space:nowrap;
      }

      #transcript{
        min-height:calc(100vh - 238px);
      }
    }
  </style>


  <style id="theme-button-fix">
    :root[data-theme="dark"] #themeButton{
      background:#ffffff;
      color:#182230;
      border-color:#dbe3ec;
    }

    :root[data-theme="dark"] #themeButton:hover:not(:disabled){
      background:#f8fafc;
      color:#111827;
      border-color:#c3cfdd;
    }
  </style>


  <style id="mobile-only-final-fix">
    @media (max-width:680px){
      /* タイトルを必ず1行で収める */
      .header{
        align-items:center;
        gap:8px;
      }

      .title-wrap{
        min-width:0;
        flex:1 1 auto;
        gap:8px;
      }

      .title-wrap h1{
        display:block;
        min-width:0;
        max-width:100%;
        font-size:16px;
        line-height:1.2;
        white-space:nowrap;
        overflow:visible;
        text-overflow:clip;
        color:#162033;
      }

      /* ダーク時もスマホのタイトルを見える色に固定 */
      :root[data-theme="dark"] .title-wrap h1{
        color:#ffffff;
      }

      /* ヘッダー右側のボタンを少し小さく */
      .header-actions{
        gap:5px;
      }

      .header-actions .tool-btn{
        min-height:36px;
        padding:0 8px;
        font-size:10px;
      }

      /* 自動スクロールを最初から見える位置へ */
      .settings{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
        overflow:visible;
        padding:9px 10px;
      }

      .setting{
        width:100%;
        min-width:0;
        justify-content:space-between;
        padding:0 10px;
        white-space:nowrap;
      }

      /* 文字サイズは横幅を広く使う */
      .setting:first-child{
        grid-column:1 / -1;
      }

      /* クレジットをスマホでも表示 */
      .credit{
        display:block;
        padding:12px 0 calc(92px + env(safe-area-inset-bottom));
        color:#98a2b3;
        font-size:10px;
        text-align:center;
      }

      :root[data-theme="dark"] .credit{
        color:#94a3b8;
      }

      /* クレジット分だけ本文下部に余裕を確保 */
      .app{
        padding-bottom:0;
      }

      #transcript{
        min-height:calc(100vh - 300px);
      }
    }
  </style>


  <style id="final-responsive-check">
    .mobile-credit{
      display:none;
    }

    @media (min-width:681px) and (max-width:1024px){
      .main-toolbar{
        display:grid;
        grid-template-columns:repeat(4,minmax(0,1fr));
      }

      .main-toolbar .primary-btn,
      .main-toolbar .danger-btn,
      .main-toolbar .tool-btn{
        width:100%;
        min-width:0;
        white-space:nowrap;
      }

      .main-toolbar .spacer{
        display:none;
      }

      .settings{
        display:grid;
        grid-template-columns:repeat(4,minmax(0,1fr));
        overflow:visible;
      }

      .setting{
        min-width:0;
        justify-content:space-between;
      }

      .statusbar{
        display:grid;
        grid-template-columns:1fr auto;
      }

      .metrics{
        width:auto;
      }
    }

    @media (max-width:680px){
      .app{
        padding-bottom:calc(82px + env(safe-area-inset-bottom));
      }

      .header{
        display:grid;
        grid-template-columns:1fr;
        gap:9px;
        padding:11px 12px 10px;
      }

      .title-wrap{
        width:100%;
        min-width:0;
        align-items:center;
      }

      .mobile-title-block{
        min-width:0;
      }

      .title-wrap h1{
        font-size:18px;
        line-height:1.2;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }

      .mobile-credit{
        display:block;
        margin-top:3px;
        color:#98a2b3;
        font-size:9px;
        line-height:1.2;
      }

      :root[data-theme="dark"] .mobile-credit{
        color:#94a3b8;
      }

      .header-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
        width:100%;
        gap:7px;
      }

      .header-actions .tool-btn{
        width:100%;
        max-width:none;
        min-height:38px;
        padding:0 8px;
        font-size:11px;
        white-space:nowrap;
      }

      /* 4つの補助操作は画面上部に2×2で常時表示 */
      .main-toolbar{
        position:static;
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
        overflow:visible;
        padding:9px 10px;
        background:#ffffff;
        border-top:0;
        border-bottom:1px solid var(--line);
        box-shadow:none;
      }

      :root[data-theme="dark"] .main-toolbar{
        background:#111827;
      }

      .main-toolbar .primary-btn,
      .main-toolbar .danger-btn,
      .main-toolbar #copyButton,
      .main-toolbar .spacer{
        display:none;
      }

      #downloadButton,
      #clearButton{
        display:block;
        width:100%;
        min-width:0;
        min-height:44px;
        grid-column:auto;
        padding:0 8px;
        font-size:11px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }

      /* 設定は2×2で全項目が一目で見える */
      .settings{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
        overflow:visible;
        padding:9px 10px;
      }

      .setting,
      .setting:first-child{
        grid-column:auto;
        width:100%;
        min-width:0;
        justify-content:space-between;
        padding:0 9px;
        font-size:11px;
      }

      .statusbar{
        display:grid;
        grid-template-columns:1fr;
        gap:8px;
        padding:9px 11px;
      }

      .metrics{
        display:grid;
        grid-template-columns:repeat(3,1fr);
        width:100%;
        gap:6px;
      }

      .metric{
        text-align:center;
      }

      .editor-wrap{
        padding:8px;
      }

      #transcript{
        min-height:calc(100vh - 340px);
        padding:15px 13px 72px;
      }

      /* 下部には主要3操作のみ */
      .mobile-dock{
        grid-template-columns:repeat(3,1fr);
      }

      .credit{
        display:none;
      }
    }

    @media (max-width:390px){
      .title-wrap h1{
        font-size:17px;
      }

      .header-actions .tool-btn{
        font-size:10px;
      }

      .setting{
        font-size:10px;
      }
    }
  </style>


  <style id="final-contrast-fix">
    /* 停止ボタンは全端末・全テーマで赤背景＋白文字 */
    .danger-btn,
    :root[data-theme="dark"] .danger-btn{
      background:#dc2626;
      border-color:#dc2626;
      color:#ffffff;
      box-shadow:0 7px 18px rgba(220,38,38,.20);
    }

    .danger-btn:hover:not(:disabled),
    :root[data-theme="dark"] .danger-btn:hover:not(:disabled){
      background:#b91c1c;
      border-color:#b91c1c;
      color:#ffffff;
    }

    .danger-btn:disabled,
    :root[data-theme="dark"] .danger-btn:disabled{
      background:#dc2626;
      border-color:#dc2626;
      color:#ffffff;
      opacity:.55;
    }

    /* スマホのヘッダーは明るい背景なので、ダーク表示中もタイトルは黒字 */
    @media (max-width:680px){
      :root[data-theme="dark"] .header{
        background:rgba(255,255,255,.97);
        border-bottom-color:#dbe3ec;
      }

      :root[data-theme="dark"] .title-wrap h1{
        color:#162033;
      }

      :root[data-theme="dark"] .mobile-credit{
        color:#667085;
      }

      :root[data-theme="dark"] .title-wrap::before{
        background:linear-gradient(180deg,#4f8df7,#2563eb);
      }
    }
  </style>


  <style id="header-unify-fix">
    /* スマホ・タブレットのヘッダー配色をPCと統一 */
    @media (max-width:1024px){
      .header,
      :root[data-theme="dark"] .header{
        background:transparent;
        border-bottom:0;
        backdrop-filter:none;
      }

      .title-wrap h1{
        color:#162033;
      }

      :root[data-theme="dark"] .title-wrap h1{
        color:#f8fafc;
      }

      .mobile-credit{
        color:#98a2b3;
      }

      :root[data-theme="dark"] .mobile-credit{
        color:#94a3b8;
      }
    }

    @media (max-width:680px){
      .header{
        position:static;
      }
    }
  </style>


  <style id="microphone-notice-style">
    .mic-notice{
      margin:12px 16px 0;
      padding:12px 14px;
      border:1px solid #f6c85f;
      border-radius:12px;
      background:#fff8e6;
      color:#8a5a00;
      font-size:13px;
      font-weight:700;
      line-height:1.6;
    }

    :root[data-theme="dark"] .mic-notice{
      background:#2a2212;
      border-color:#7a5b18;
      color:#f8d477;
    }

    .mic-notice[hidden]{
      display:none;
    }

    @media (max-width:680px){
      .mic-notice{
        margin:9px 10px 0;
        padding:11px 12px;
        font-size:12px;
      }
    }
  </style>


  <style id="wake-lock-visual-state">
    #wakeButton{
      transition:background-color .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    #wakeButton.wake-active{
      background:#039855;
      border-color:#039855;
      color:#ffffff;
      box-shadow:0 8px 20px rgba(3,152,85,.22);
    }

    #wakeButton.wake-active:hover:not(:disabled){
      background:#027a48;
      border-color:#027a48;
      color:#ffffff;
    }

    :root[data-theme="dark"] #wakeButton.wake-active{
      background:#22c55e;
      border-color:#22c55e;
      color:#052e16;
      box-shadow:0 8px 20px rgba(34,197,94,.24);
    }

    :root[data-theme="dark"] #wakeButton.wake-active:hover:not(:disabled){
      background:#16a34a;
      border-color:#16a34a;
      color:#ffffff;
    }
  </style>


  <style id="complete-version-adjustments">
    :root[data-theme="dark"] #copyButton:hover:not(:disabled),
    :root[data-theme="dark"] #downloadButton:hover:not(:disabled),
    :root[data-theme="dark"] #wakeButton:not(.wake-active):hover:not(:disabled){
      background:#243047;
      border-color:#64748b;
      color:#ffffff;
    }

    :root[data-theme="dark"] #wakeButton.wake-active:hover:not(:disabled){
      background:#16a34a;
      border-color:#16a34a;
      color:#ffffff;
    }

    .settings{
      justify-content:flex-start;
    }

    @media (max-width:1024px){
      .settings{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="title-wrap">
        <div class="mobile-title-block">
          <h1>リアルタイム文字起こし</h1>
          <div class="mobile-credit">@2026 Takayuki WAYAMA</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeButton" class="tool-btn" type="button">ダーク表示</button>
        <button id="wakeButton" class="tool-btn" type="button" aria-pressed="false">画面スリープ無効化</button>
      </div>
    </header>

    <section class="panel">
      <div class="main-toolbar">
        <button id="startButton" class="primary-btn" type="button">文字起こし開始</button>
        <button id="stopButton" class="danger-btn" type="button" disabled>停止</button>
        <button id="copyButton" class="tool-btn" type="button">全文コピー</button>
        <button id="downloadButton" class="tool-btn" type="button">テキスト保存</button>
        <div class="spacer"></div>
        <button id="clearButton" class="tool-btn" type="button">全文クリア</button>
      </div>

      <div class="settings">
        <div class="setting">
          <span>文字サイズ</span>
          <select id="fontSizeSelect">
            <option value="18">小</option>
            <option value="22" selected>標準</option>
            <option value="28">大</option>
            <option value="34">特大</option>
          </select>
        </div>

        

        

        <div class="setting">
          <label class="switch">
            <span>自動スクロール</span>
            <input id="autoScrollToggle" type="checkbox" checked>
            <span class="switch-ui"></span>
          </label>
        </div>
      </div>

      <div class="statusbar">
        <div class="status-left">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">待機中</span>
        </div>

        <div class="metrics">
          <span class="metric">文字数<strong id="characterCount">0</strong></span>
          <span class="metric">行数<strong id="lineCount">0</strong></span>
          <span class="metric">時間<strong id="elapsedTime">00:00</strong></span>
        </div>
      </div>

      <div id="micNotice" class="mic-notice" hidden>
        マイクがオフになっています。ブラウザまたは端末の設定で、マイクの使用を許可してください。
      </div>

      <div class="editor-wrap">
        <div class="editor-box">
<textarea id="transcript" placeholder="文字起こしを開始すると、ここに文章が表示されます。"></textarea>
          <div id="interimText" class="interim" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <div class="credit">@2026 Takayuki WAYAMA</div>
  </main>


  <div class="mobile-dock">
    <button id="mobileStartButton" class="primary-btn" type="button">開始</button>
    <button id="mobileStopButton" class="danger-btn" type="button" disabled>停止</button>
    <button id="mobileCopyButton" class="tool-btn" type="button">コピー</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const $ = id => document.getElementById(id);

      const transcript = $("transcript");
      const interimText = $("interimText");
      const startButtons = [$("startButton"), $("mobileStartButton")];
      const stopButtons = [$("stopButton"), $("mobileStopButton")];
      const copyButtons = [$("copyButton"), $("mobileCopyButton")];
      const downloadButton = $("downloadButton");
      const clearButton = $("clearButton");
      const wakeButton = $("wakeButton");
      const themeButton = $("themeButton");
      const fontSizeSelect = $("fontSizeSelect");
      const autoScrollToggle = $("autoScrollToggle");
      const statusText = $("statusText");
      const statusDot = $("statusDot");
      const characterCount = $("characterCount");
      const lineCount = $("lineCount");
      const elapsedTime = $("elapsedTime");
      const toast = $("toast");
      const micNotice = $("micNotice");

      let recognition = null;
      let recognitionActive = false;
      let pendingInterim = "";
      let sentenceBoundaryTimer = null;
      let shouldContinue = false;
      let restartTimer = null;
      let lastFinalText = "";
      let lastFinalAt = 0;
      let startTime = null;
      let clockTimer = null;
      let wakeLock = null;
      let microphoneStartTimer = null;

      function showToast(message){
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1600);
      }

      function updateStats(){
        const value = transcript.value;
        characterCount.textContent = value.length.toLocaleString("ja-JP");
        lineCount.textContent = value ? value.split(/\n/).length.toLocaleString("ja-JP") : "0";
      }

      function showMicNotice(message = "マイクがオフになっています。ブラウザまたは端末の設定で、マイクの使用を許可してください。"){
        micNotice.textContent = message;
        micNotice.hidden = false;
      }

      function hideMicNotice(){
        micNotice.hidden = true;
      }

      async function checkMicrophonePermission(){
        if(!navigator.permissions?.query) return;

        try{
          const permission = await navigator.permissions.query({name:"microphone"});

          if(permission.state === "denied"){
            showMicNotice();
          }else{
            hideMicNotice();
          }

          permission.addEventListener("change", () => {
            if(permission.state === "denied"){
              showMicNotice();
            }else{
              hideMicNotice();
            }
          });
        }catch(error){
          // Safariなど、microphone権限の事前確認に未対応の環境では開始時に判定する
        }
      }

      function setStatus(message, mode="idle"){
        statusText.textContent = message;
        statusDot.className = "status-dot";
        if(mode === "listening") statusDot.classList.add("listening");
        if(mode === "error") statusDot.classList.add("error");
      }

      function setRunning(running){
        startButtons.forEach(button => button.disabled = running);
        stopButtons.forEach(button => button.disabled = !running);
      }

      function startClock(){
        startTime = Date.now();
        clearInterval(clockTimer);
        clockTimer = setInterval(() => {
          const sec = Math.floor((Date.now() - startTime) / 1000);
          elapsedTime.textContent =
            String(Math.floor(sec / 60)).padStart(2,"0") + ":" +
            String(sec % 60).padStart(2,"0");
        }, 500);
      }

      function stopClock(){
        clearInterval(clockTimer);
        clockTimer = null;
      }

      function normalizeText(text){
        return text.replace(/[ \t]+/g," ").trim();
      }

      function clearSentenceBoundaryTimer(){
        clearTimeout(sentenceBoundaryTimer);
        sentenceBoundaryTimer = null;
      }

      function endsWithSentencePunctuation(text){
        return /[。！？!?…]$/.test(text.trim());
      }

      function sentenceBoundaryDelay(text){
        const normalized = text.trim();

        // Typical Japanese sentence-final forms: punctuate sooner.
        const likelySentenceEnd =
          /(です|ます|でした|ました|ません|でしょう|である|だった|だ|ない|なかった|たい|ください|できる|できます|できました|ある|あります|ありません|いる|いました|思う|思います|思いました|ですか|ますか|でしょうか|よね|ですね|かな)$/;

        // Particles and connective expressions often indicate that the sentence continues.
        const likelyContinuation =
          /(は|が|を|に|へ|で|と|の|も|から|まで|より|ので|のに|けど|けれど|けれども|そして|また|つまり|例えば|たとえば|えっと|あの)$/;

        if(likelySentenceEnd.test(normalized)) return 650;
        if(likelyContinuation.test(normalized)) return 1050;
        return 800;
      }

      function scheduleSentenceBoundary(){
        clearSentenceBoundaryTimer();

        const snapshot = transcript.value.trimEnd();
        if(!snapshot || endsWithSentencePunctuation(snapshot)) return;

        const delay = sentenceBoundaryDelay(snapshot);

        sentenceBoundaryTimer = setTimeout(() => {
          if(!shouldContinue || pendingInterim) return;

          const current = transcript.value.trimEnd();
          if(!current || current !== snapshot || endsWithSentencePunctuation(current)) return;

          transcript.value = current + "。";
          updateStats();
          moveToEnd();
        }, delay);
      }

      function moveToEnd(){
        if(!autoScrollToggle.checked) return;
        transcript.scrollTop = transcript.scrollHeight;
        transcript.selectionStart = transcript.selectionEnd = transcript.value.length;
      }

      function appendFinalText(text){
        const cleaned = normalizeText(text);
        if(!cleaned) return;

        const now = Date.now();
        if(cleaned === lastFinalText && now - lastFinalAt < 1800) return;

        lastFinalText = cleaned;
        lastFinalAt = now;
        transcript.value += cleaned;

        updateStats();
        moveToEnd();
      }

      function scheduleRecognitionStart(delay = 120){
        if(!shouldContinue) return;

        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          if(!shouldContinue || recognitionActive) return;

          createRecognition();

          try{
            recognition.start();
          }catch(error){
            if(shouldContinue){
              scheduleRecognitionStart(250);
            }
          }
        }, delay);
      }

      function createRecognition(){
        recognition = new SpeechRecognition();
        recognition.lang = "ja-JP";
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          recognitionActive = true;
          clearTimeout(microphoneStartTimer);
          hideMicNotice();
          setRunning(true);
          setStatus("認識中","listening");
        };

        recognition.onspeechstart = () => {
          clearSentenceBoundaryTimer();
          setStatus("認識中","listening");
        };

        recognition.onspeechend = () => {
          if(shouldContinue){
            setStatus("音声待機中","listening");
            scheduleSentenceBoundary();
          }
        };

        recognition.onresult = event => {
          clearSentenceBoundaryTimer();
          let interim = "";

          for(let i = event.resultIndex; i < event.results.length; i++){
            const result = event.results[i];
            const recognizedText = result[0]?.transcript || "";

            if(result.isFinal){
              appendFinalText(recognizedText);
              pendingInterim = "";
            }else{
              interim += recognizedText;
            }
          }

          pendingInterim = normalizeText(interim);
          interimText.textContent = pendingInterim;

          if(!pendingInterim && shouldContinue){
            scheduleSentenceBoundary();
          }
        };

        recognition.onerror = event => {
          clearTimeout(microphoneStartTimer);

          const recoverableErrors = ["no-speech","network","aborted"];
          if(recoverableErrors.includes(event.error)){
            if(shouldContinue){
              setStatus("音声待機中","listening");
            }
            return;
          }

          shouldContinue = false;
          recognitionActive = false;
          clearSentenceBoundaryTimer();
          pendingInterim = "";
          interimText.textContent = "";
          setRunning(false);
          stopClock();

          const messages = {
            "not-allowed":"マイクの使用を許可してください",
            "service-not-allowed":"音声認識を利用できません",
            "audio-capture":"マイクが利用できません"
          };

          if(event.error === "not-allowed" || event.error === "audio-capture"){
            showMicNotice();
          }

          setStatus(messages[event.error] || "音声認識を継続できません","error");
        };

        recognition.onend = () => {
          recognitionActive = false;

          if(shouldContinue && pendingInterim){
            appendFinalText(pendingInterim);
          }

          pendingInterim = "";
          interimText.textContent = "";

          if(shouldContinue){
            setStatus("音声待機中","listening");
            scheduleRecognitionStart(120);
          }else{
            setRunning(false);
            setStatus("停止中");
          }
        };
      }

      function startRecognition(){
        if(shouldContinue || recognitionActive) return;

        shouldContinue = true;
        pendingInterim = "";
        setStatus("起動中","listening");
        showMicNotice("マイクの使用を確認しています。許可画面が表示された場合は「許可」を選んでください。");
        startClock();

        clearTimeout(microphoneStartTimer);
        microphoneStartTimer = setTimeout(() => {
          if(statusText.textContent === "起動中"){
            showMicNotice();
            setStatus("マイクを確認してください","error");
          }
        }, 3000);

        scheduleRecognitionStart(0);
      }

      function stopRecognition(){
        shouldContinue = false;
        recognitionActive = false;
        pendingInterim = "";

        clearTimeout(microphoneStartTimer);
        clearTimeout(restartTimer);
        clearSentenceBoundaryTimer();
        interimText.textContent = "";
        stopClock();

        try{ recognition?.abort(); }catch(error){}

        setRunning(false);
        setStatus("停止中");
      }

      async function copyText(){
        if(!transcript.value){
          showToast("コピーする文章がありません");
          return;
        }

        try{
          await navigator.clipboard.writeText(transcript.value);
          showToast("全文をコピーしました");
        }catch(error){
          transcript.select();
          document.execCommand("copy");
          transcript.setSelectionRange(transcript.value.length,transcript.value.length);
          showToast("全文をコピーしました");
        }
      }

      function insertAtCursor(text){
        const start = transcript.selectionStart;
        const end = transcript.selectionEnd;
        transcript.setRangeText(text,start,end,"end");
        updateStats();
        transcript.focus();
        moveToEnd();
      }

      function saveText(){
        if(!transcript.value){
          showToast("保存する文章がありません");
          return;
        }

        const now = new Date();
        const p = value => String(value).padStart(2,"0");
        const filename = `transcript_${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}.txt`;
        const url = URL.createObjectURL(new Blob([transcript.value],{type:"text/plain;charset=utf-8"}));
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        anchor.click();
        URL.revokeObjectURL(url);
        showToast("テキストを保存しました");
      }

      function clearText(){
        if(!transcript.value){
          showToast("文章がありません");
          return;
        }

        if(!confirm("表示中の文章をすべて消しますか？")) return;

        transcript.value = "";
        interimText.textContent = "";
        lastFinalText = "";
        lastFinalAt = 0;
        updateStats();
        transcript.focus();
      }

      function applyTheme(theme){
        document.documentElement.dataset.theme = theme;
        themeButton.textContent = theme === "dark" ? "ライト表示" : "ダーク表示";

        try{
          localStorage.setItem("transcriptionTheme", theme);
        }catch(error){}
      }

      function toggleTheme(){
        const current = document.documentElement.dataset.theme || "light";
        applyTheme(current === "dark" ? "light" : "dark");
      }

      async function toggleWakeLock(){
        if(!("wakeLock" in navigator)){
          showToast("この端末では利用できません");
          return;
        }

        try{
          if(wakeLock){
            await wakeLock.release();
            wakeLock = null;
            wakeButton.textContent = "画面スリープ無効化";
            wakeButton.classList.remove("wake-active");
            wakeButton.setAttribute("aria-pressed", "false");
          }else{
            wakeLock = await navigator.wakeLock.request("screen");
            wakeButton.textContent = "画面スリープ無効";
            wakeButton.classList.add("wake-active");
            wakeButton.setAttribute("aria-pressed", "true");

            wakeLock.addEventListener("release", () => {
              wakeLock = null;
              wakeButton.textContent = "画面スリープ無効化";
              wakeButton.classList.remove("wake-active");
              wakeButton.setAttribute("aria-pressed", "false");
            });
          }
        }catch(error){
          showToast("画面固定を開始できません");
        }
      }

      startButtons.forEach(button => button.addEventListener("click",startRecognition));
      stopButtons.forEach(button => button.addEventListener("click",stopRecognition));
      copyButtons.forEach(button => button.addEventListener("click",copyText));
      downloadButton.addEventListener("click",saveText);
      clearButton.addEventListener("click",clearText);
      themeButton.addEventListener("click",toggleTheme);
      wakeButton.addEventListener("click",toggleWakeLock);
      fontSizeSelect.addEventListener("change",() => {
        transcript.style.fontSize = fontSizeSelect.value + "px";
      });
      transcript.addEventListener("input",updateStats);

      checkMicrophonePermission();

      try{
        applyTheme(localStorage.getItem("transcriptionTheme") || "light");
      }catch(error){
        applyTheme("light");
      }

      if(!SpeechRecognition){
        startButtons.forEach(button => button.disabled = true);
        setStatus("ブラウザ非対応","error");
      }else{
        createRecognition();
      }

      updateStats();
    })();
  </script>
</body>
