<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>リアルタイム文字起こし</title>
  <style>
    :root{
      --bg:#0a1020;
      --panel:#111827;
      --panel-2:#172033;
      --panel-3:#0d1526;
      --text:#f8fafc;
      --muted:#94a3b8;
      --line:#243047;
      --line-strong:#334155;
      --primary:#3b82f6;
      --primary-dark:#2563eb;
      --danger:#f87171;
      --danger-soft:rgba(248,113,113,.10);
      --success:#22c55e;
      --shadow:0 26px 80px rgba(0,0,0,.36);
      --radius:22px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-width:1024px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(37,99,235,.17), transparent 28rem),
        radial-gradient(circle at 88% 12%, rgba(14,165,233,.08), transparent 24rem),
        linear-gradient(180deg,#0a1020 0%,#080d18 100%);
      color:var(--text);
    }

    button,select,textarea{font:inherit}

    .app{
      width:min(1380px,calc(100% - 56px));
      margin:0 auto;
      padding:32px 0 42px;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      margin-bottom:18px;
    }

    .title-wrap{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .title-wrap::before{
      content:"";
      width:10px;
      height:42px;
      border-radius:999px;
      background:linear-gradient(180deg,#60a5fa,#2563eb);
      box-shadow:0 0 28px rgba(59,130,246,.42);
    }

    .title-wrap h1{
      margin:0;
      font-size:32px;
      line-height:1.15;
      letter-spacing:-.03em;
      font-weight:800;
    }

    .header-actions{
      display:flex;
      gap:10px;
    }

    .tool-btn,
    .primary-btn,
    .danger-btn{
      min-height:44px;
      border-radius:12px;
      border:1px solid var(--line);
      padding:0 16px;
      background:var(--panel-2);
      color:var(--text);
      font-weight:700;
      cursor:pointer;
      transition:.16s ease;
      box-shadow:0 8px 20px rgba(0,0,0,.12);
    }

    .tool-btn:hover:not(:disabled){
      border-color:var(--line-strong);
      background:#1d293b;
      transform:translateY(-1px);
    }

    .primary-btn{
      background:linear-gradient(180deg,#4f8ef7,var(--primary-dark));
      border-color:#4f8ef7;
      color:#fff;
      box-shadow:0 10px 28px rgba(37,99,235,.28);
    }

    .primary-btn:hover:not(:disabled){
      background:linear-gradient(180deg,#5c98ff,#2e6fe7);
      transform:translateY(-1px);
    }

    .danger-btn{
      background:var(--danger-soft);
      border-color:rgba(248,113,113,.28);
      color:#fca5a5;
    }

    button:disabled{opacity:.42;cursor:not-allowed;transform:none!important}

    .panel{
      background:rgba(17,24,39,.96);
      border:1px solid rgba(71,85,105,.45);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(18px);
    }

    .main-toolbar{
      display:grid;
      grid-template-columns:auto auto auto auto auto auto 1fr auto;
      align-items:center;
      gap:9px;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,rgba(23,32,51,.98),rgba(17,24,39,.98));
    }

    .main-toolbar .spacer{min-width:12px}

    .settings{
      display:flex;
      align-items:center;
      gap:10px;
      padding:11px 16px;
      background:var(--panel-3);
      border-bottom:1px solid var(--line);
    }

    .setting{
      display:flex;
      align-items:center;
      gap:8px;
      min-height:38px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--panel-2);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .setting select{
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-weight:700;
    }

    .switch{
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
    }

    .switch input{display:none}

    .switch-ui{
      width:36px;
      height:21px;
      border-radius:999px;
      background:#334155;
      position:relative;
      transition:.18s ease;
    }

    .switch-ui::after{
      content:"";
      position:absolute;
      top:3px;
      left:3px;
      width:15px;
      height:15px;
      border-radius:50%;
      background:#cbd5e1;
      transition:.18s ease;
      box-shadow:0 1px 3px rgba(0,0,0,.3);
    }

    .switch input:checked + .switch-ui{
      background:var(--primary);
    }

    .switch input:checked + .switch-ui::after{
      left:18px;
      background:#fff;
    }

    .statusbar{
      display:grid;
      grid-template-columns:1fr auto auto auto;
      align-items:center;
      gap:24px;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      background:#101827;
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:13px;
      font-weight:700;
    }

    .status-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#64748b;
    }

    .status-dot.listening{
      background:var(--success);
      box-shadow:0 0 0 6px rgba(34,197,94,.12);
      animation:pulse 1.5s infinite;
    }

    .status-dot.error{
      background:var(--danger);
    }

    @keyframes pulse{50%{opacity:.45}}

    .metrics{
      display:contents;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .metric{
      white-space:nowrap;
      color:var(--muted);
    }

    .metric strong{
      color:#e2e8f0;
      font-size:14px;
      margin-left:6px;
    }

    .editor-wrap{
      padding:16px;
      background:var(--panel);
    }

    .editor-box{
      position:relative;
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      background:#0c1423;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
    }

    #transcript{
      width:100%;
      min-height:66vh;
      border:0;
      outline:0;
      resize:vertical;
      padding:24px 24px 86px;
      font-size:22px;
      line-height:1.92;
      letter-spacing:.01em;
      color:#f8fafc;
      background:#0c1423;
      caret-color:#60a5fa;
    }

    #transcript::placeholder{color:#64748b}

    .interim{
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      min-height:44px;
      max-height:70px;
      overflow:auto;
      padding:10px 12px;
      border-radius:10px;
      background:rgba(30,41,59,.96);
      border:1px dashed #3b4a60;
      color:#94a3b8;
      font-size:12px;
      line-height:1.5;
      pointer-events:none;
    }

    .interim:empty::before{
      content:"認識途中のテキスト";
      color:#64748b;
    }

    .credit{
      text-align:center;
      color:#64748b;
      font-size:11px;
      padding:16px 0 0;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:26px;
      transform:translate(-50%,16px);
      background:#e2e8f0;
      color:#111827;
      border-radius:999px;
      padding:10px 16px;
      font-size:13px;
      font-weight:700;
      opacity:0;
      pointer-events:none;
      transition:.18s ease;
      z-index:100;
      box-shadow:0 12px 28px rgba(0,0,0,.28);
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }
  </style>

  <style id="responsive-layout">
    @media (max-width: 1024px){
      body{min-width:0}
      .app{width:min(100% - 24px,1024px);padding:22px 0 34px}
      .header{align-items:flex-start}
      .title-wrap h1{font-size:27px}
      .main-toolbar{display:flex;flex-wrap:wrap}
      .main-toolbar .primary-btn,
      .main-toolbar .danger-btn,
      .main-toolbar .tool-btn{flex:1 1 calc(25% - 9px)}
      .main-toolbar .spacer{display:none}
      .statusbar{display:flex;flex-wrap:wrap}
      .metrics{display:flex;width:auto;gap:18px}
      #transcript{min-height:62vh}
    }

    @media (max-width: 680px){
      .app{width:100%;padding:0 0 calc(84px + env(safe-area-inset-bottom))}
      .header{
        position:sticky;top:0;z-index:20;align-items:center;margin:0;
        padding:12px 13px;background:rgba(10,16,32,.95);
        backdrop-filter:blur(14px);border-bottom:1px solid var(--line)
      }
      .title-wrap{gap:9px}
      .title-wrap::before{width:7px;height:28px}
      .title-wrap h1{font-size:19px}
      .header-actions .tool-btn{min-height:38px;padding:0 10px;font-size:11px}
      .panel{border:0;border-radius:0;box-shadow:none}
      .settings{
        overflow-x:auto;flex-wrap:nowrap;padding:9px 10px;scrollbar-width:none
      }
      .settings::-webkit-scrollbar{display:none}
      .setting{flex:none}
      .statusbar{padding:10px 12px;gap:10px}
      .metrics{width:100%;justify-content:space-between;gap:6px}
      .editor-wrap{padding:9px}
      .editor-box{border-radius:12px}
      #transcript{
        min-height:calc(100vh - 224px);resize:none;
        padding:16px 14px 76px;font-size:20px;line-height:1.82
      }
      .interim{left:8px;right:8px;bottom:8px}
      .credit{display:none}
      .main-toolbar{
        position:fixed;left:0;right:0;bottom:0;z-index:50;
        display:grid;grid-template-columns:1fr 1fr 64px 64px;gap:8px;
        padding:9px 10px calc(9px + env(safe-area-inset-bottom));
        background:rgba(10,16,32,.97);backdrop-filter:blur(14px);
        border-top:1px solid var(--line);border-bottom:0
      }
      .main-toolbar .primary-btn,
      .main-toolbar .danger-btn,
      .main-toolbar .tool-btn{
        min-width:0;min-height:50px;padding:0 8px;font-size:12px
      }
      #timestampButton,
      #downloadButton,
      #clearButton,
      .main-toolbar .spacer{display:none}
    }
  </style>

</head>
<body>
  <main class="app">
    <header class="header">
      <div class="title-wrap">
        <h1>リアルタイム文字起こし</h1>
      </div>
      <div class="header-actions">
        <button id="wakeButton" class="tool-btn" type="button">スリープ機能OFF</button>
      </div>
    </header>

    <section class="panel">
      <div class="main-toolbar">
        <button id="startButton" class="primary-btn" type="button">文字起こし開始</button>
        <button id="stopButton" class="danger-btn" type="button" disabled>停止</button>
        <button id="copyButton" class="tool-btn" type="button">全文コピー</button>
        <button id="lineBreakButton" class="tool-btn" type="button">改行</button>
        <button id="timestampButton" class="tool-btn" type="button">時刻挿入</button>
        <button id="downloadButton" class="tool-btn" type="button">テキスト保存</button>
        <div class="spacer"></div>
        <button id="clearButton" class="tool-btn" type="button">全文クリア</button>
      </div>

      <div class="settings">
        <div class="setting">
          <span>文字サイズ</span>
          <select id="fontSizeSelect">
            <option value="18">小</option>
            <option value="22" selected>標準</option>
            <option value="28">大</option>
            <option value="34">特大</option>
          </select>
        </div>

        <div class="setting">
          <label class="switch">
            <span>句読点</span>
            <input id="punctuationToggle" type="checkbox" checked>
            <span class="switch-ui"></span>
          </label>
        </div>

        <div class="setting">
          <label class="switch">
            <span>自動改行</span>
            <input id="autoBreakToggle" type="checkbox" checked>
            <span class="switch-ui"></span>
          </label>
        </div>

        <div class="setting">
          <label class="switch">
            <span>自動スクロール</span>
            <input id="autoScrollToggle" type="checkbox" checked>
            <span class="switch-ui"></span>
          </label>
        </div>
      </div>

      <div class="statusbar">
        <div class="status-left">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">待機中</span>
        </div>

        <div class="metrics">
          <span class="metric">文字数<strong id="characterCount">0</strong></span>
          <span class="metric">行数<strong id="lineCount">0</strong></span>
          <span class="metric">時間<strong id="elapsedTime">00:00</strong></span>
        </div>
      </div>

      <div class="editor-wrap">
        <div class="editor-box">
          <textarea id="transcript" placeholder="文字起こしを開始すると、ここに文章が表示されます。"></textarea>
          <div id="interimText" class="interim" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <div class="credit">@2026 Takayuki WAYAMA</div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const $ = id => document.getElementById(id);

      const transcript = $("transcript");
      const interimText = $("interimText");
      const startButtons = [$("startButton")];
      const stopButtons = [$("stopButton")];
      const copyButtons = [$("copyButton")];

      const lineBreakButton = $("lineBreakButton");
      const timestampButton = $("timestampButton");
      const downloadButton = $("downloadButton");
      const clearButton = $("clearButton");
      const wakeButton = $("wakeButton");
      const fontSizeSelect = $("fontSizeSelect");
      const punctuationToggle = $("punctuationToggle");
      const autoBreakToggle = $("autoBreakToggle");
      const autoScrollToggle = $("autoScrollToggle");
      const statusText = $("statusText");
      const statusDot = $("statusDot");
      const characterCount = $("characterCount");
      const lineCount = $("lineCount");
      const elapsedTime = $("elapsedTime");
      const toast = $("toast");

      let recognition = null;
      let shouldContinue = false;
      let restartTimer = null;
      let autoBreakTimer = null;
      let lastFinalText = "";
      let lastFinalAt = 0;
      let lastFinalEventAt = 0;
      let startTime = null;
      let clockTimer = null;
      let wakeLock = null;

      function showToast(message){
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1600);
      }

      function updateStats(){
        const value = transcript.value;
        characterCount.textContent = value.length.toLocaleString("ja-JP");
        lineCount.textContent = value ? value.split(/\n/).length.toLocaleString("ja-JP") : "0";
      }

      function setStatus(message, mode="idle"){
        statusText.textContent = message;
        statusDot.className = "status-dot";
        if(mode === "listening") statusDot.classList.add("listening");
        if(mode === "error") statusDot.classList.add("error");
      }

      function setRunning(running){
        startButtons.forEach(button => button.disabled = running);
        stopButtons.forEach(button => button.disabled = !running);
      }

      function startClock(){
        startTime = Date.now();
        clearInterval(clockTimer);
        clockTimer = setInterval(() => {
          const sec = Math.floor((Date.now() - startTime) / 1000);
          elapsedTime.textContent =
            String(Math.floor(sec / 60)).padStart(2,"0") + ":" +
            String(sec % 60).padStart(2,"0");
        }, 500);
      }

      function stopClock(){
        clearInterval(clockTimer);
        clockTimer = null;
      }

      function normalizeText(text){
        return text.replace(/[ \t]+/g," ").trim();
      }

      function endsWithPunctuation(text){
        return /[。！？!?、…]$/.test(text.trim());
      }

      function chooseSeparator(now){
        const current = transcript.value.trimEnd();
        if(!current) return "";
        if(!punctuationToggle.checked) return /\s$/.test(transcript.value) ? "" : " ";
        if(endsWithPunctuation(current)) return "";
        const gap = lastFinalEventAt ? now - lastFinalEventAt : 0;
        if(gap >= 1600) return "。";
        if(gap >= 600) return "、";
        return "";
      }

      function moveToEnd(){
        if(!autoScrollToggle.checked) return;
        transcript.scrollTop = transcript.scrollHeight;
        transcript.selectionStart = transcript.selectionEnd = transcript.value.length;
      }

      function scheduleAutoBreak(){
        clearTimeout(autoBreakTimer);
        if(!shouldContinue || !autoBreakToggle.checked) return;

        autoBreakTimer = setTimeout(() => {
          const current = transcript.value.trimEnd();
          if(!current || current.endsWith("\n")) return;
          transcript.value = current + (endsWithPunctuation(current) ? "\n" : "。\n");
          updateStats();
          moveToEnd();
        }, 4000);
      }

      function appendFinalText(text){
        const cleaned = normalizeText(text);
        if(!cleaned) return;

        const now = Date.now();
        if(cleaned === lastFinalText && now - lastFinalAt < 1800) return;

        lastFinalText = cleaned;
        lastFinalAt = now;
        transcript.value += chooseSeparator(now) + cleaned;
        lastFinalEventAt = now;

        updateStats();
        moveToEnd();
        scheduleAutoBreak();
      }

      function createRecognition(){
        recognition = new SpeechRecognition();
        recognition.lang = "ja-JP";
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          setRunning(true);
          setStatus("認識中","listening");
        };

        recognition.onresult = event => {
          clearTimeout(autoBreakTimer);
          let interim = "";

          for(let i = event.resultIndex; i < event.results.length; i++){
            const result = event.results[i];
            const text = result[0]?.transcript || "";
            result.isFinal ? appendFinalText(text) : interim += text;
          }

          interimText.textContent = normalizeText(interim);
        };

        recognition.onerror = event => {
          if(event.error === "no-speech"){
            setStatus("音声待機中","listening");
            return;
          }

          if(event.error === "aborted") return;

          shouldContinue = false;
          setRunning(false);
          stopClock();
          interimText.textContent = "";

          const messages = {
            "not-allowed":"マイクを許可してください",
            "service-not-allowed":"音声認識を利用できません",
            "audio-capture":"マイクを確認してください",
            "network":"通信を確認してください"
          };

          setStatus(messages[event.error] || "エラーが発生しました","error");
        };

        recognition.onend = () => {
          interimText.textContent = "";

          if(shouldContinue){
            setStatus("再接続中","listening");
            clearTimeout(restartTimer);
            restartTimer = setTimeout(() => {
              try{ recognition.start(); }
              catch(error){ recognition.onend(); }
            }, 350);
          }else{
            setRunning(false);
            setStatus("停止中");
          }
        };
      }

      function startRecognition(){
        if(!recognition) return;

        shouldContinue = true;
        lastFinalEventAt = 0;
        setStatus("起動中","listening");
        startClock();

        try{
          recognition.start();
        }catch(error){
          if(error.name !== "InvalidStateError"){
            shouldContinue = false;
            setRunning(false);
            stopClock();
            setStatus("開始できません","error");
          }
        }
      }

      function stopRecognition(){
        shouldContinue = false;
        clearTimeout(restartTimer);
        clearTimeout(autoBreakTimer);
        interimText.textContent = "";
        stopClock();

        try{ recognition?.stop(); }catch(error){}

        setRunning(false);
        setStatus("停止中");
      }

      async function copyText(){
        if(!transcript.value){
          showToast("コピーする文章がありません");
          return;
        }

        try{
          await navigator.clipboard.writeText(transcript.value);
          showToast("全文をコピーしました");
        }catch(error){
          transcript.select();
          document.execCommand("copy");
          transcript.setSelectionRange(transcript.value.length,transcript.value.length);
          showToast("全文をコピーしました");
        }
      }

      function insertAtCursor(text){
        const start = transcript.selectionStart;
        const end = transcript.selectionEnd;
        transcript.setRangeText(text,start,end,"end");
        updateStats();
        transcript.focus();
        moveToEnd();
      }

      function insertTimestamp(){
        const now = new Date();
        insertAtCursor(`[${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}] `);
      }

      function saveText(){
        if(!transcript.value){
          showToast("保存する文章がありません");
          return;
        }

        const now = new Date();
        const p = value => String(value).padStart(2,"0");
        const filename = `transcript_${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}.txt`;
        const url = URL.createObjectURL(new Blob([transcript.value],{type:"text/plain;charset=utf-8"}));
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        anchor.click();
        URL.revokeObjectURL(url);
        showToast("テキストを保存しました");
      }

      function clearText(){
        if(!transcript.value){
          showToast("文章がありません");
          return;
        }

        if(!confirm("表示中の文章をすべて消しますか？")) return;

        transcript.value = "";
        interimText.textContent = "";
        lastFinalText = "";
        lastFinalAt = 0;
        lastFinalEventAt = 0;
        updateStats();
        transcript.focus();
      }

      async function toggleWakeLock(){
        if(!("wakeLock" in navigator)){
          showToast("この端末では利用できません");
          return;
        }

        try{
          if(wakeLock){
            await wakeLock.release();
            wakeLock = null;
            wakeButton.textContent = "スリープ機能OFF";
          }else{
            wakeLock = await navigator.wakeLock.request("screen");
            wakeButton.textContent = "スリープ機能OFF中";
          }
        }catch(error){
          showToast("画面固定を開始できません");
        }
      }

      startButtons.forEach(button => button.addEventListener("click",startRecognition));
      stopButtons.forEach(button => button.addEventListener("click",stopRecognition));
      copyButtons.forEach(button => button.addEventListener("click",copyText));

      lineBreakButton.addEventListener("click",() => insertAtCursor("\n"));
      timestampButton.addEventListener("click",insertTimestamp);
      downloadButton.addEventListener("click",saveText);
      clearButton.addEventListener("click",clearText);
      wakeButton.addEventListener("click",toggleWakeLock);
      fontSizeSelect.addEventListener("change",() => {
        transcript.style.fontSize = fontSizeSelect.value + "px";
      });
      transcript.addEventListener("input",updateStats);

      if(!SpeechRecognition){
        startButtons.forEach(button => button.disabled = true);
        setStatus("ブラウザ非対応","error");
      }else{
        createRecognition();
      }

      updateStats();
    })();
  </script>
</body>
</html>
